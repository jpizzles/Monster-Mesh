name: Build Monster Mesh (Solo base - validation)

# Solo-based Monster Mesh track. Builds MeshCore-Solo for the Wio Tracker L1 Pro
# (board target `wio-tracker-l1`, identical board JSON to the Digitaino build we
# already run on the device) and applies the Monster Mesh Solo patch
# (.monster/monster_patch_solo.py) on top. Foundation (stock Solo) was confirmed
# booting on real hardware 2026-09-12; increments now build up SOS look +
# Digitaino nav.
#
# Runs only on the `solo-base` branch so `main` (the working Digitaino build,
# also tagged monster-mash-v0.2.0-digitaino) is never touched.

on:
  push:
    branches: [solo-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Monster Mesh
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Fetch MeshCore-Solo base
        run: |
          git clone https://github.com/MarekZegare4/MeshCore-Solo.git firmware
          cd firmware
          git checkout d72fed66c123ad2b6cfdf08f5b0acc38932a6a41

      - name: Apply Monster Mesh customizations
        working-directory: firmware
        run: python "$GITHUB_WORKSPACE/.monster/monster_patch_solo.py"

      - name: Verify Monster Mesh customizations
        working-directory: firmware
        run: |
          grep -q 'Monster Mesh: silent by default' examples/companion_radio/MyMesh.cpp
          grep -q 'GPS" centred on the title row' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'plain dots; current page' examples/companion_radio/ui-new/UITask.cpp
          test -f examples/companion_radio/ui-new/MonsterSnakeScreen.h
          grep -q 'MonsterSnakeScreen' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'ACT_SNAKE' examples/companion_radio/ui-new/ToolsScreen.h

      - name: Build Wio Tracker L1 Pro UF2 (Monster Mesh on Solo)
        working-directory: firmware
        run: |
          set -o pipefail
          if ! pio run -e WioTrackerL1_companion_solo_dual 2>&1 | tee build.log; then
            # Surface the actual compiler errors as GitHub annotations (visible in
            # the run summary) so a failure doesn't require digging into the log.
            grep -E "error:" build.log | head -30 | sed 's/^/::error::/' || true
            exit 1
          fi
          mkdir -p ../dist
          uf2=$(find .pio/build/WioTrackerL1_companion_solo_dual -name '*.uf2' | head -1)
          test -n "$uf2"
          cp "$uf2" ../dist/Monster-Mesh-Solo-WioTracker-L1-Pro.uf2
          sha256sum ../dist/Monster-Mesh-Solo-WioTracker-L1-Pro.uf2 > ../dist/Monster-Mesh-Solo-WioTracker-L1-Pro-SHA256.txt

      - name: Upload downloadable firmware
        uses: actions/upload-artifact@v4
        with:
          name: Monster-Mesh-Solo-WioTracker-L1-Pro
          path: dist/
          if-no-files-found: error
          retention-days: 90
