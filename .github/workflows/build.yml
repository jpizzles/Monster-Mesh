name: Build Monster Mesh firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Monster Mesh
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Fetch DigitainoMeshCore base
        run: |
          git clone https://github.com/pesqair/DigitainoMeshCore.git firmware
          cd firmware
          git checkout 6d090074973262b549bcfa9b7ca64226307ca688

      - name: Apply Monster Mesh customizations
        working-directory: firmware
        run: python "$GITHUB_WORKSPACE/.monster/monster_patch.py"

      - name: Verify Monster Mesh features
        working-directory: firmware
        run: |
          grep -q 'DOWN: Flood' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'Unfavorite' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'Rooms' examples/companion_radio/ui-new/UITask.cpp
          grep -q '_freq_edit_mode' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'L/R digit  U/D value' examples/companion_radio/ui-new/UITask.cpp
          grep -q 'Navigation' examples/companion_radio/ui-new/UITask.cpp

      - name: Build Wio Tracker L1 Pro UF2
        working-directory: firmware
        env:
          FIRMWARE_VERSION: monster-mesh
        run: |
          pio run -e WioTrackerL1_companion_radio_ble -t create_uf2
          mkdir -p ../dist
          cp .pio/build/WioTrackerL1_companion_radio_ble/firmware.uf2 ../dist/Monster-Mesh-WioTracker-L1-Pro.uf2
          sha256sum ../dist/Monster-Mesh-WioTracker-L1-Pro.uf2 > ../dist/Monster-Mesh-WioTracker-L1-Pro-SHA256.txt

      - name: Upload downloadable firmware
        uses: actions/upload-artifact@v4
        with:
          name: Monster-Mesh-WioTracker-L1-Pro
          path: dist/
          if-no-files-found: error
          retention-days: 90
